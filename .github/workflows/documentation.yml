name: Documentation

on:
  pull_request:
    paths:
      - '**/*.md'
      - scripts/check_documentation.py
      - .github/workflows/documentation.yml
  push:
    branches: [main]
    paths:
      - '**/*.md'
      - scripts/check_documentation.py
      - .github/workflows/documentation.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  liens:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Vérifier les liens locaux
        run: python3 scripts/check_documentation.py
      - name: Vérifier les espaces du patch
        run: git show --format= --check HEAD

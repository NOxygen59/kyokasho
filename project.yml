name: Kyokasho
options:
  bundleIdPrefix: fr.noxygen59
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  developmentLanguage: fr
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    TARGETED_DEVICE_FAMILY: "2"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
  configs:
    Release:
      SWIFT_OPTIMIZATION_LEVEL: "-O"
      SWIFT_COMPILATION_MODE: wholemodule
      GCC_OPTIMIZATION_LEVEL: s
      LLVM_LTO: YES_THIN
packages:
  KyokashoKit:
    path: Packages/KyokashoKit
  GLMOCRKit:
    path: Packages/GLMOCRKit
targets:
  Kyokasho:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - "Config/Local.xcconfig"
          - "Config/Secrets.plist"
    dependencies:
      - package: KyokashoKit
        product: ReaderCore
      - package: KyokashoKit
        product: OCRKit
      - package: KyokashoKit
        product: DictionaryKit
      - package: KyokashoKit
        product: ReviewKit
      - package: KyokashoKit
        product: ONNXOCRKit
      - package: KyokashoKit
        product: MorphologyKit
      - package: GLMOCRKit
        product: GLMOCRKit
      - sdk: PDFKit.framework
      - sdk: PencilKit.framework
      - sdk: WebKit.framework
    configFiles:
      Debug: App/Config/App.xcconfig
      Release: App/Config/App.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.noxygen59.kyokasho
        PRODUCT_NAME: Kyokasho
        MARKETING_VERSION: "1.3.2"
        CURRENT_PROJECT_VERSION: "59"
        INFOPLIST_FILE: App/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_ENTITLEMENTS: App/Kyokasho.entitlements
        SUPPORTS_MACCATALYST: NO
